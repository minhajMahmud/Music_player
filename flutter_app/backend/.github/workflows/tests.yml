name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.0.1'
      SERVERPOD_PASSWORD_database: '81CoHL4__iQ8-yZ5phIjV_niBD1oFHn_'
      SERVERPOD_PASSWORD_redis: '9VV1Mtd8nz1DXgtwejQq4MBdEG6x3kWh'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: backend_server
        run: docker compose up --build -d

      - name: Install dependencies
        working-directory: backend_server
        run: dart pub get

      - name: Install Serverpod CLI
        working-directory: backend_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: backend_server
        run: serverpod generate

      - name: Run tests
        working-directory: backend_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: backend_server
        run: docker compose down -v
